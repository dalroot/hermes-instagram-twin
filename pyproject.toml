[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-use"
version = "0.2.0"
description = "Make Instagram usable for AI agents — MCP Server and Agent Plugin with Ghost Mode and Authenticated Meta Graph Twin"
readme = "README.md"
authors = [{ name = "dalroot" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools]
py-modules = ["bridge", "handlers", "schemas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
